# Builds the site from src/ and deploys the artifact to GitHub Pages
# (app.pombo.cc). Audit #7: with Pages sourced from this workflow, what is
# served is provably the committed source — there is no checked-in bundle to
# tamper with.
#
# js/install-pre.js, js/install-modal.js and js/frame-guard.js are
# hand-written SOURCE that happens to live in js/ (webpack does not produce
# them) — they ship with the artifact via the js/ copy and must stay in the
# repository.

name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run test:run

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html sw.js CNAME robots.txt sitemap.xml _site/
          cp -r js css favicon curation _site/
          # Android App Links: the site has to serve this for the OS to accept
          # that com.pombo.android may open app.pombo.cc links. Unverified,
          # Android 12+ drops the app from the chooser entirely.
          cp -r .well-known _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # The action tars with `--exclude=.[^/]*` unless told otherwise, so
          # .well-known is dropped from the artifact even though the assemble
          # step copied it — the file ships in the repo and 404s in production.
          # _site holds only what the step above puts there, so including
          # hidden entries pulls in nothing else.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
