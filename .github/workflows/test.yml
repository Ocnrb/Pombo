# Runs the unit suite on every pull request, so a PR shows green/red before
# merge. The deploy workflow runs the same suite again on main as the gate.

name: Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run test:run
